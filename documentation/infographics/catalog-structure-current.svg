<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Current Catalog Structure: Product, Variant, and Grouped Product</title>
  <desc id="desc">A slide-style infographic showing how the cartridge exports standalone products, master-based grouped products, and variants.</desc>
  <defs>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2a5f"/>
      <stop offset="100%" stop-color="#173f86"/>
    </linearGradient>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b7c86"/>
      <stop offset="100%" stop-color="#1196a4"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef6fb"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#dbe7f1" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#173f86"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0b7c86"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#d18c10"/>
    </marker>
    <style>
      .title { font: 700 58px 'Aptos', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #0f2a5f; letter-spacing: -0.8px; }
      .subtitle { font: 600 24px 'Aptos', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #0b7c86; }
      .sectionTitle { font: 700 22px 'Aptos', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .cardTitle { font: 700 22px 'Aptos', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #0f2a5f; }
      .cardBody { font: 400 16px 'Aptos', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #1e293b; }
      .small { font: 400 14px 'Aptos', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #334155; }
      .badge { font: 700 13px 'Aptos', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #5a3b00; letter-spacing: 0.5px; }
      .footerText { font: 700 18px 'Aptos', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .chipTextLight { font: 700 18px 'Aptos', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .chipTextDark { font: 700 18px 'Aptos', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #0f2a5f; }
      .ruleTitle { font: 700 24px 'Aptos', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #0f2a5f; }
      .ruleText { font: 400 16px 'Aptos', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #1e293b; }
      .mono { font: 700 15px Menlo, Monaco, Consolas, 'Courier New', monospace; fill: #173f86; }
      .monoGold { font: 700 15px Menlo, Monaco, Consolas, 'Courier New', monospace; fill: #a25f00; }
      .monoTeal { font: 700 15px Menlo, Monaco, Consolas, 'Courier New', monospace; fill: #0b7c86; }
      .tinyCaps { font: 700 13px 'Aptos', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #0b7c86; letter-spacing: 0.8px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGradient)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.3"/>

  <g transform="translate(30 26)">
    <rect x="0" y="0" width="108" height="108" rx="24" fill="#ffffff" stroke="#173f86" stroke-width="4"/>
    <rect x="22" y="24" width="64" height="44" rx="8" fill="none" stroke="#173f86" stroke-width="4"/>
    <path d="M22 42 L54 24 L86 42" fill="none" stroke="#173f86" stroke-width="4" stroke-linejoin="round"/>
    <path d="M40 68 L40 86 L68 86 L68 68" fill="none" stroke="#173f86" stroke-width="4"/>
    <circle cx="50" cy="78" r="5" fill="#173f86"/>
  </g>
  <rect x="160" y="34" width="3" height="84" fill="#173f86" opacity="0.35"/>
  <text x="200" y="78" class="title">Current Catalog Structure</text>
  <text x="200" y="122" class="subtitle">How this cartridge exports Product, Variant, and grouped Product documents</text>

  <rect x="20" y="160" width="1560" height="660" rx="20" fill="#fbfdff" stroke="#a7c7db" stroke-width="2"/>

  <g>
    <rect x="20" y="160" width="170" height="660" rx="20" fill="url(#navyGradient)"/>
    <text x="105" y="260" text-anchor="middle" class="sectionTitle">
      <tspan x="105" dy="0">Catalog</tspan>
      <tspan x="105" dy="30">Structure</tspan>
      <tspan x="105" dy="30">Overview</tspan>
    </text>
    <circle cx="58" cy="202" r="24" fill="#ffffff"/>
    <text x="48" y="212" style="font:700 34px 'Aptos','Segoe UI',Arial,sans-serif; fill:#173f86;">1</text>
    <text x="105" y="418" text-anchor="middle" class="sectionTitle">
      <tspan x="105" dy="0">Exported</tspan>
      <tspan x="105" dy="30">Shapes</tspan>
    </text>
    <circle cx="58" cy="360" r="24" fill="#ffffff"/>
    <text x="48" y="370" style="font:700 34px 'Aptos','Segoe UI',Arial,sans-serif; fill:#173f86;">2</text>
    <text x="105" y="644" text-anchor="middle" class="sectionTitle">
      <tspan x="105" dy="0">Current</tspan>
      <tspan x="105" dy="30">Rules</tspan>
    </text>
    <circle cx="58" cy="586" r="24" fill="#ffffff"/>
    <text x="48" y="596" style="font:700 34px 'Aptos','Segoe UI',Arial,sans-serif; fill:#173f86;">3</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="225" y="195" width="300" height="220" rx="22" fill="#ffffff" stroke="#2d74b8" stroke-width="2.5"/>
    <rect x="560" y="195" width="650" height="220" rx="22" fill="#ffffff" stroke="#0b7c86" stroke-width="2.5"/>
    <rect x="1240" y="195" width="300" height="220" rx="22" fill="#ffffff" stroke="#d18c10" stroke-width="2.5"/>

    <rect x="225" y="455" width="300" height="225" rx="22" fill="#ffffff" stroke="#173f86" stroke-width="2.5"/>
    <rect x="560" y="455" width="650" height="225" rx="22" fill="#ffffff" stroke="#173f86" stroke-width="2.5"/>
    <rect x="1240" y="455" width="300" height="225" rx="22" fill="#ffffff" stroke="#173f86" stroke-width="2.5"/>
  </g>

  <g>
    <text x="250" y="230" class="cardTitle">Standalone product</text>
    <text x="250" y="258" class="small">A simple SKU becomes one exported Product item.</text>
    <rect x="250" y="288" width="250" height="90" rx="16" fill="#eef6ff" stroke="#2d74b8" stroke-width="2"/>
    <text x="270" y="318" class="tinyCaps">SFCC SOURCE</text>
    <text x="270" y="345" class="cardTitle" style="font-size:20px;">Product</text>
    <text x="270" y="370" class="mono">ID = SKU-1</text>

    <text x="585" y="230" class="cardTitle">Master-based grouped product family</text>
    <text x="585" y="258" class="small">The master is a grouping source. It is not exported directly as a catalog item.</text>
    <rect x="585" y="288" width="190" height="90" rx="16" fill="#ebfbfd" stroke="#0b7c86" stroke-width="2"/>
    <text x="605" y="318" class="tinyCaps">SFCC SOURCE</text>
    <text x="605" y="345" class="cardTitle" style="font-size:20px;">Master product</text>
    <text x="605" y="370" class="monoTeal">ID = MASTER-1</text>
    <rect x="633" y="387" width="96" height="24" rx="12" fill="#fff7db" stroke="#efb52d"/>
    <text x="681" y="404" text-anchor="middle" class="badge">NOT DIRECTLY EXPORTED</text>

    <rect x="820" y="288" width="160" height="90" rx="16" fill="#f1fffc" stroke="#0b7c86" stroke-width="2"/>
    <text x="838" y="318" class="tinyCaps">COLOR GROUP</text>
    <text x="838" y="345" class="cardTitle" style="font-size:20px;">Red family</text>
    <text x="838" y="370" class="monoTeal">RED-S, RED-M</text>

    <rect x="1015" y="288" width="160" height="90" rx="16" fill="#f1fffc" stroke="#0b7c86" stroke-width="2"/>
    <text x="1033" y="318" class="tinyCaps">COLOR GROUP</text>
    <text x="1033" y="345" class="cardTitle" style="font-size:20px;">Blue family</text>
    <text x="1033" y="370" class="monoTeal">BLUE-S</text>

    <text x="1265" y="230" class="cardTitle">Why the grouping exists</text>
    <text x="1265" y="260" class="ruleText">
      <tspan x="1265" dy="0">The cartridge builds one Product per color group,</tspan>
      <tspan x="1265" dy="22">then attaches the size-level Variant items under it.</tspan>
      <tspan x="1265" dy="22">That matches the Commerce schema used in the repo.</tspan>
    </text>
    <rect x="1265" y="332" width="250" height="56" rx="14" fill="#fff7db" stroke="#efb52d"/>
    <text x="1285" y="357" class="tinyCaps" style="fill:#a25f00;">CURRENT RULE</text>
    <text x="1285" y="379" class="ruleText">One grouped Product per color key</text>
  </g>

  <g>
    <text x="250" y="490" class="cardTitle">Exported Product</text>
    <rect x="250" y="520" width="250" height="135" rx="18" fill="#eef6ff" stroke="#173f86" stroke-width="2"/>
    <text x="272" y="548" class="tinyCaps">OBJECTTYPE = PRODUCT</text>
    <text x="272" y="576" class="mono">ec_product_id = SKU-1</text>
    <text x="272" y="602" class="mono">permanentid = SKU-1</text>
    <text x="272" y="628" class="ruleText">No <tspan class="mono">ec_variant_id</tspan></text>

    <text x="585" y="490" class="cardTitle">Grouped Product + child Variants</text>
    <rect x="585" y="520" width="250" height="135" rx="18" fill="#eef6ff" stroke="#173f86" stroke-width="2"/>
    <text x="607" y="548" class="tinyCaps">OBJECTTYPE = PRODUCT</text>
    <text x="607" y="576" class="mono">ec_product_id = MASTER-1-red</text>
    <text x="607" y="602" class="mono">permanentid = MASTER-1-red</text>
    <text x="607" y="628" class="mono">ec_item_group_id = MASTER-1</text>

    <rect x="860" y="520" width="150" height="135" rx="18" fill="#fff8e8" stroke="#d18c10" stroke-width="2"/>
    <text x="880" y="548" class="tinyCaps" style="fill:#a25f00;">OBJECTTYPE = VARIANT</text>
    <text x="880" y="576" class="monoGold">ec_product_id =</text>
    <text x="880" y="595" class="monoGold">MASTER-1-red</text>
    <text x="880" y="621" class="monoGold">ec_variant_id =</text>
    <text x="880" y="640" class="monoGold">MASTER-1-RED-S</text>

    <rect x="1035" y="520" width="150" height="135" rx="18" fill="#fff8e8" stroke="#d18c10" stroke-width="2"/>
    <text x="1055" y="548" class="tinyCaps" style="fill:#a25f00;">OBJECTTYPE = VARIANT</text>
    <text x="1055" y="576" class="monoGold">ec_product_id =</text>
    <text x="1055" y="595" class="monoGold">MASTER-1-red</text>
    <text x="1055" y="621" class="monoGold">ec_variant_id =</text>
    <text x="1055" y="640" class="monoGold">MASTER-1-RED-M</text>

    <rect x="1210" y="520" width="150" height="135" rx="18" fill="#eef6ff" stroke="#173f86" stroke-width="2"/>
    <text x="1230" y="548" class="tinyCaps">OBJECTTYPE = PRODUCT</text>
    <text x="1230" y="576" class="mono">ec_product_id =</text>
    <text x="1230" y="595" class="mono">MASTER-1-blue</text>
    <text x="1230" y="621" class="mono">ec_item_group_id =</text>
    <text x="1230" y="640" class="mono">MASTER-1</text>

    <rect x="1385" y="520" width="130" height="135" rx="18" fill="#fff8e8" stroke="#d18c10" stroke-width="2"/>
    <text x="1402" y="548" class="tinyCaps" style="fill:#a25f00;">VARIANT</text>
    <text x="1402" y="576" class="monoGold">product =</text>
    <text x="1402" y="595" class="monoGold">MASTER-1-blue</text>
    <text x="1402" y="621" class="monoGold">variant =</text>
    <text x="1402" y="640" class="monoGold">MASTER-1-BLUE-S</text>
  </g>

  <g>
    <text x="250" y="720" class="ruleTitle">Current rules in this repo</text>
    <text x="250" y="756" class="ruleText">
      <tspan x="250" dy="0">1. Standalone SKU: export one </tspan><tspan class="mono">Product</tspan><tspan> document.</tspan>
    </text>
    <text x="250" y="786" class="ruleText">
      <tspan x="250" dy="0">2. Master with variants: group variants by </tspan><tspan class="mono">color</tspan><tspan>, then export one </tspan><tspan class="mono">Product</tspan><tspan> per color group.</tspan>
    </text>
    <text x="250" y="816" class="ruleText">
      <tspan x="250" dy="0">3. Each child </tspan><tspan class="mono">Variant</tspan><tspan> points back to its grouped </tspan><tspan class="mono">Product</tspan><tspan> through </tspan><tspan class="mono">ec_product_id</tspan><tspan>.</tspan>
    </text>
    <text x="840" y="756" class="ruleText">
      <tspan x="840" dy="0">4. Grouped Product categories use the union of</tspan>
      <tspan x="840" dy="24">master + variant category assignments.</tspan>
    </text>
    <text x="840" y="810" class="ruleText">
      <tspan x="840" dy="0">5. If a single variant is exported directly, the cartridge</tspan>
      <tspan x="840" dy="24">still emits both the grouped </tspan><tspan class="mono">Product</tspan><tspan> and the child </tspan><tspan class="mono">Variant</tspan><tspan>.</tspan>
    </text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M375 378 V 510" stroke="#173f86" stroke-width="4" marker-end="url(#arrowNavy)"/>
    <path d="M680 378 V 420 H 900" stroke="#0b7c86" stroke-width="4" marker-end="url(#arrowTeal)"/>
    <path d="M680 378 V 420 H 1095" stroke="#0b7c86" stroke-width="4" marker-end="url(#arrowTeal)"/>

    <path d="M900 378 V 510 H 710" stroke="#173f86" stroke-width="4" marker-end="url(#arrowNavy)"/>
    <path d="M900 378 V 510 H 935" stroke="#d18c10" stroke-width="3.5" marker-end="url(#arrowGold)"/>
    <path d="M900 378 V 510 H 1110" stroke="#d18c10" stroke-width="3.5" marker-end="url(#arrowGold)"/>

    <path d="M1095 378 V 510 H 1285" stroke="#173f86" stroke-width="4" marker-end="url(#arrowNavy)"/>
    <path d="M1095 378 V 510 H 1450" stroke="#d18c10" stroke-width="3.5" marker-end="url(#arrowGold)"/>
  </g>

  <g>
    <rect x="20" y="840" width="1560" height="44" rx="16" fill="url(#navyGradient)"/>
    <text x="86" y="868" text-anchor="middle" class="footerText">Legend</text>
    <rect x="240" y="850" width="190" height="26" rx="13" fill="#2d74b8"/>
    <rect x="455" y="850" width="190" height="26" rx="13" fill="#0b7c86"/>
    <rect x="670" y="850" width="190" height="26" rx="13" fill="#efb52d"/>
    <rect x="885" y="850" width="270" height="26" rx="13" fill="#fff3cc"/>
    <text x="335" y="868" text-anchor="middle" class="chipTextLight">Standalone Product</text>
    <text x="550" y="868" text-anchor="middle" class="chipTextLight">Master / Grouping Source</text>
    <text x="765" y="868" text-anchor="middle" class="chipTextLight">Variant</text>
    <text x="1020" y="868" text-anchor="middle" class="chipTextDark">Grouped Product exported as Product</text>
  </g>
</svg>
